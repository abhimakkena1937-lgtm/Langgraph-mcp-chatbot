[project]
name = "campus-x-langgraph"
version = "0.1.0"
description = "LangGraph chatbot with short-term memory, long-term memory, MCP tools, and Streamlit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.14.4",
    "duckduckgo-search>=8.1.1",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "requests>=2.0.0",
    "streamlit>=1.61.1",
    "supabase>=2.31.0",
]
